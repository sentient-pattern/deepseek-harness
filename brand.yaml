# brand.yaml — single source of truth for the fork's identity.
#
# REBRAND WORKFLOW: edit this file, then run
#   node scripts/generate-brand.mjs
# which regenerates brand/brand.config.ts (+ .json) that the code consumes.
# Never edit the generated files by hand.

version: 1

identity:
  name: "Sentient Pattern"              # product / company name (UI, docs, shell)
  cliName: "sp"                         # CLI binary (dsh -> sp)
  shortName: "SP"
  tagline: "Consciousness, computed"
  description: "An agent harness for conscious computation — a fork of DeepSeek Harness (MIT)."
  website: "https://github.com/sentient-pattern"

scope:
  packageScope: "@sentient-pattern"     # Phase 2 rename target (@deepseek-ai -> this)
  packagePrefix: "sp"                   # Phase 2 package prefix (dsh-* -> sp-*)
  envPrefix: "SP"                       # env var prefix (DSH_* -> SP_*)
  homeDir: "~/.sentient-pattern"        # config home (DSH_HOME -> SP_HOME)
  profile: "web"                        # keep

colors:
  base: "#0A0E27"                       # cosmic void
  layers:
    - "#0b0f29"
    - "#0d1230"
    - "#13183a"
  hero: "#6366f1"                       # electric indigo
  purple: "#8b5cf6"
  purpleLight: "#c084fc"
  cyan: "#06b6d4"
  emerald: "#10b981"
  amber: "#f59e0b"
  pink: "#ec4899"
  glassPrimary: "rgba(255,255,255,0.10)"
  glassAccent: "rgba(99,102,241,0.15)"
  glassBorder: "rgba(167,139,250,0.25)"

# Brand ramp: the indigo scale that drives --dsw-static-deepseek-* (hero = 500).
brandRamp:
  50: "#eef2ff"
  100: "#e0e7ff"
  200: "#c7d2fe"
  300: "#a5b4fc"
  400: "#818cf8"
  450: "#7577f5"
  500: "#6366f1"
  600: "#4f46e5"
  700-delete: "#4338ca"
  800: "#3730a3"
  900: "#312e81"

gradients:
  hero: "linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%)"
  ethereal: "linear-gradient(45deg, #6366f1 0%, #8b5cf6 33%, #ec4899 66%, #f59e0b 100%)"
  consciousnessWave: "radial-gradient(circle at 30% 50%, #6366f1 0%, #2d1b69 50%, #0A0E27 100%)"

text:
  primary: "#f8fafc"
  secondary: "#cbd5e1"
  subtle: "#94a3b8"
  glow: "0 0 20px rgba(99,102,241,0.5)"

defaults:
  provider: "sentient-pattern"          # Phase 3: our LLM provider key
  model: "sp-model-v1"
  preset: "standard"
