# Keyless replay counterpart of agent-instructions.cordis.yml. Patches do not
# compose across includes, so this applies the scenario config and model swap
# directly to the live tree.
- id: base
  name: '@forgeweaver/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-forgeweaver
        name: '@forgeweaver/fw-llm-forgeweaver'
        disabled: true
      - id: acp-agent
        name: '@forgeweaver/fw-acp-demo'
        config:
          provider: forgeweaver-official
          model: forgeweaver-v4-flash
          persistenceRoot: !!js process.env.FW_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: 'none'
          workspaceContext:
            maxBytes: 65536
            fwHome: !!js process.cwd() + '/.fw'
            projectRootMarkers:
              - .fw-project
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: llm-replay
            name: '@forgeweaver/fw-llm-replay'
          - id: workspace-context-compaction
            name: './tests/fixtures/workspace-context-compaction.ts'
