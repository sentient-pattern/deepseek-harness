# Keyless counterpart to background-job-admission.cordis.yml: replace the
# ForgeWeaver adapter with replay while preserving the app's one-task admission
# config and the recorded flash route.
- id: base
  name: '@forgeweaver/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-forgeweaver
        name: '@forgeweaver/fw-llm-forgeweaver'
        disabled: true
      - id: acp-agent
        name: '@forgeweaver/fw-acp-demo'
        config:
          provider: forgeweaver-official
          model: forgeweaver-v4-flash
          persistenceRoot: !!js process.env.FW_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          tasks:
            maxConcurrentJobsPerOwner: 1
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: llm-replay
            name: '@forgeweaver/fw-llm-replay'
            config:
              providers:
                - id: forgeweaver-official
                  name: ForgeWeaver
                  models:
                    - id: forgeweaver-v4-flash
                    - id: forgeweaver-v4-pro
