# Keyless both mode combines the runtime/registry patch with the ForgeWeaver-to-replay
# swap. Include patches cannot target entries behind a nested include, so this file
# applies both overlays directly to `cordis.yml`.
- id: base
  name: '@forgeweaver/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-forgeweaver
        name: '@forgeweaver/fw-llm-forgeweaver'
        disabled: true
      - id: acp-agent
        name: '@forgeweaver/fw-acp-demo'
        config:
          provider: forgeweaver-official
          model: forgeweaver-v4-flash
          persistenceRoot: !!js process.env.FW_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: 'none'
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: both
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: code-runtime
            name: '@forgeweaver/fw-code-runtime-worker-thread'
          - id: llm-replay
            name: '@forgeweaver/fw-llm-replay'
            config:
              providers:
                - id: forgeweaver-official
                  name: ForgeWeaver
                  models:
                    - id: forgeweaver-v4-flash
                    - id: forgeweaver-v4-pro
