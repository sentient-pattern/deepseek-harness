# Keyless twin of subagent-result-diagnostic.cordis.yml: keep the same test
# provider/tool and replace only the external model adapter.
- id: base
  name: '@forgeweaver/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: llm-replay
            name: '@forgeweaver/fw-llm-replay'
            config:
              providers:
                - id: forgeweaver-official
                  name: ForgeWeaver
                  models:
                    - id: forgeweaver-v4-flash
                    - id: forgeweaver-v4-pro
          - id: subagent-result-diagnostic
            name: './tests/fixtures/subagent-result-diagnostic.ts'
          - id: tool-subagent-codex
            name: '@forgeweaver/fw-tool-subagent'
            config:
              provider: snapshot-diagnostic
              toolName: subagent_codex
              backgroundMode: one-shot
              maxDepth: provider-managed
      - id: llm-forgeweaver
        name: '@forgeweaver/fw-llm-forgeweaver'
        disabled: true
