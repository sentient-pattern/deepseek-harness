# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@forgeweaver/fw-system-prompt'

- id: tools
  name: '@forgeweaver/fw-tools'

- id: subprocess
  name: '@forgeweaver/fw-subprocess-local'

- id: bash
  name: '@forgeweaver/fw-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@forgeweaver/fw-shell-env'

- id: tasks
  name: '@forgeweaver/fw-jobs-local'

- id: tool-jobs
  name: '@forgeweaver/fw-tool-jobs'

- id: tool-pwsh
  name: '@forgeweaver/fw-tool-pwsh'
