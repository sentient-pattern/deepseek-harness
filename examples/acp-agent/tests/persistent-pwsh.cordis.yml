# Minimal live counterpart for the persistent-pwsh-tool-turn snapshot composition.
- id: llm-forgeweaver
  name: '@forgeweaver/fw-llm-forgeweaver'
  config:
    models:
      - id: forgeweaver-v4-pro

- id: sandbox-policy
  name: '@forgeweaver/fw-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@forgeweaver/fw-subprocess-local'

- id: terminal
  name: '@forgeweaver/fw-terminal'

- id: terminal-pwsh
  name: '@forgeweaver/fw-terminal-bash'
  config:
    shellDialect: pwsh
    timeoutMs: 30000

- id: acp-agent
  name: '@forgeweaver/fw-acp-demo'
  config:
    provider: forgeweaver-official
    model: forgeweaver-v4-pro
    persistenceRoot: !!js process.env.FW_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.FW_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh-persistent
  name: '@forgeweaver/fw-tool-pwsh-persistent'
