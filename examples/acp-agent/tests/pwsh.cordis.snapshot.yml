# Minimal keyless composition: real app, pwsh executor, and pwsh tool; replayed model.
- id: llm-replay
  name: '@forgeweaver/fw-llm-replay'
  config:
    providers:
      - id: forgeweaver-official
        name: ForgeWeaver
        models:
          - id: forgeweaver-v4-pro

- id: subprocess
  name: '@forgeweaver/fw-subprocess-local'

- id: bash
  name: '@forgeweaver/fw-pwsh-local'

- id: shell-env
  name: '@forgeweaver/fw-shell-env'

- id: acp-agent
  name: '@forgeweaver/fw-acp-demo'
  config:
    provider: forgeweaver-official
    model: forgeweaver-v4-pro
    persistenceRoot: !!js process.env.FW_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: none
    workspaceContext: false
    skills:
      enabled: false
    # job_output/job_kill stay mounted (the bundle's toolJobs default) so
    # background pwsh runs are readable and killable.
    goals: false
    # The pwsh tool replaces the bundle's bash tool in this composition.
    toolBash: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh
  name: '@forgeweaver/fw-tool-pwsh'
