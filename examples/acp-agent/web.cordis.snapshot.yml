# Keyless replay counterpart to web.cordis.yml: the web stack and loopback
# fixture server stay real (the tool call re-executes the actual HTTP fetch and
# markdown rendering); only the model adapter is replaced by replay.
- id: base
  name: '@forgeweaver/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-forgeweaver
        name: '@forgeweaver/fw-llm-forgeweaver'
        disabled: true
      - insert:
          - id: web
            name: '@forgeweaver/fw-web'
          - id: web-fetch-http
            name: '@forgeweaver/fw-web-fetch-http'
          - id: web-fetch-fixture
            name: './web-fetch-fixture-server.mjs'
          - id: tool-web
            name: '@forgeweaver/fw-tool-web'
            config:
              search: false
          - id: llm-replay
            name: '@forgeweaver/fw-llm-replay'
            config:
              providers:
                - id: forgeweaver-official
                  name: ForgeWeaver
                  models:
                    - id: forgeweaver-v4-flash
                    - id: forgeweaver-v4-pro
