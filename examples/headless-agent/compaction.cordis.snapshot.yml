# Keyless context-overflow composition for the assembled compaction snapshot.
- id: base
  name: '@forgeweaver/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-forgeweaver
        name: '@forgeweaver/fw-llm-forgeweaver'
        disabled: true
      - id: compaction-basic
        name: '@forgeweaver/fw-compaction-basic'
        config:
          thresholdRatio: 0.99
          retainTokens: 20
          maxTokens: 32
      - insert:
          - id: llm-replay
            name: '@forgeweaver/fw-llm-replay'
            config:
              providers:
                - id: forgeweaver-official
                  models:
                    - id: forgeweaver-v4-flash
                      contextWindow: 128000
