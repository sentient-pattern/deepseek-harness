# Replay counterpart to goal.cordis.yml. It includes cordis.yml directly because
# a config patch cannot target an entry behind a nested include, then restates
# the goal overlay while replacing the live model with keyless replay.
- id: base
  name: '@forgeweaver/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-forgeweaver
        name: '@forgeweaver/fw-llm-forgeweaver'
        disabled: true
      - insert:
          - id: goal
            name: '@forgeweaver/fw-goal'
          - id: tool-goal
            name: '@forgeweaver/fw-tool-goal'
          - id: llm-replay
            name: '@forgeweaver/fw-llm-replay'
