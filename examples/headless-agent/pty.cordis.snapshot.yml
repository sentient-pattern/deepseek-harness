# Keyless opt-in PTY composition for the headless stream-json snapshot.
- id: base
  name: '@forgeweaver/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-forgeweaver
        name: '@forgeweaver/fw-llm-forgeweaver'
        disabled: true
      - insert:
          - id: sandbox-policy
            name: '@forgeweaver/fw-sandbox-policy'
            config:
              mode: danger-full-access
          - id: pty
            name: '@forgeweaver/fw-terminal'
          - id: pty-snapshot-backend
            name: '../acp-agent/pty-snapshot-backend.mjs'
          - id: tool-terminal
            name: '@forgeweaver/fw-tool-terminal'
            config:
              maxResultBytes: 64
          - id: llm-replay
            name: '@forgeweaver/fw-llm-replay'
