# Replay counterpart to cordis.yml for the shipped Ralph-loop snapshot.
- id: base
  name: '@forgeweaver/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-forgeweaver
        name: '@forgeweaver/fw-llm-forgeweaver'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@forgeweaver/fw-llm-replay'
