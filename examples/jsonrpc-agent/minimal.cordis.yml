# Complete unattended minimal-agent composition for the Python SDK. The model
# sees one deployment-selected system prompt and only the owner-scoped
# persistent Bash and string-replace editor tools. Runtime-context injection and
# context compaction are absent.

- id: sdk-jsonrpc-server
  name: '@forgeweaver/fw-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-forgeweaver
  name: '@forgeweaver/fw-llm-forgeweaver'
  config:
    apiKeyEnv: FORGEWEAVER_API_KEY
    streamIdleTimeoutMs: 172800000
    models:
      - id: !!js process.env.FW_MODEL ?? 'forgeweaver-v4-flash'
        contextWindow: !!js Number(process.env.FW_CONTEXT_WINDOW ?? 1000000)

- id: sandbox
  name: '@forgeweaver/fw-sandbox-local'

- id: sandbox-policy
  name: '@forgeweaver/fw-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.FW_CWD ?? process.cwd()

- id: subprocess
  name: '@forgeweaver/fw-subprocess-local'

- id: pty
  name: '@forgeweaver/fw-terminal'

- id: terminal-bash
  name: '@forgeweaver/fw-terminal-bash'
  config:
    timeoutMs: 300000

# The editor uses the bare local filesystem; persistent Bash still consumes the
# shared danger-full-access sandbox policy above.
- id: fs-local
  name: '@forgeweaver/fw-fs-local'
  config:
    cwd: !!js process.env.FW_CWD ?? process.cwd()

- id: agent-spine
  name: '@forgeweaver/fw-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.FW_SYSTEM_PROMPT ?? 'You are a helpful software engineer assistant.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: persistent-bash
  name: '@forgeweaver/fw-tool-bash-persistent'
  config:
    timeoutMs: 300000
    description: |-
      Run commands in a bash shell
      * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
      * You don't have access to the internet via this tool.
      * You do have access to a mirror of common linux and python packages via apt and pip.
      * State is persistent across command calls and discussions with the user.
      * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
      * Please avoid commands that may produce a very large amount of output.
      * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

- id: str-replace-editor
  name: '@forgeweaver/fw-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

- id: sessions
  name: '@forgeweaver/fw-session-persistence-jsonl'
  config:
    root: !!js process.env.FW_SESSION_ROOT ?? './.sessions'
    compression: none
