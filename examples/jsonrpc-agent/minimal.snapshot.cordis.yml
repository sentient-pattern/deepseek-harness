# Keyless replay keeps the complete minimal composition intact and replaces
# only its live ForgeWeaver adapter with the fixture-backed provider. The replay
# catalog claims the same route initialized by the SDK.
- id: base
  name: '@forgeweaver/cordis-plugin-include'
  config:
    path: ./minimal.cordis.yml
    patches:
      - id: llm-forgeweaver
        name: '@forgeweaver/fw-llm-forgeweaver'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@forgeweaver/fw-llm-replay'
            config:
              providers:
                - id: forgeweaver-official
                  name: ForgeWeaver
                  models:
                    - id: forgeweaver-v4-flash
