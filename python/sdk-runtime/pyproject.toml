[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "forgeweaver-harness-runtime-bin"
version = "0.0.0.dev0"
description = "Pinned ForgeWeaver runtime for the Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ForgeWeaver" }]

[project.urls]
Homepage = "https://github.com/sentient-pattern/deepseek-harness"
Documentation = "https://github.com/sentient-pattern/deepseek-harness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/sentient-pattern/deepseek-harness/issues"
Source = "https://github.com/sentient-pattern/deepseek-harness"

# Include the injected executable and default config; exclude the dev-only node
# closure from wheels and sdists.
[tool.hatch.build]
artifacts = ["src/forgeweaver_harness_runtime/runtime/fw-jsonrpc-agent-*"]
exclude = ["src/forgeweaver_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/forgeweaver_harness_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
